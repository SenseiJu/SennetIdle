[versions]
kotlin = "2.4.21"

paper = "26.3.build.+"
placeholderApi = "2.12.3"
fancyHolograms = "2.10.0"
fancyNpcs = "2.11.0"
worldGuard = "7.0.19"

acf = "0.5.1-SNAPSHOT"
configurate = "4.2.0"
hikari = "7.1.0"
mariadb = "3.5.10"
invui = "2.5.1"
exposed = "1.5.1"
coroutines = "1.11.0"

shadow = "9.6.1"
resource-factory = "1.4.0"

[libraries]
paperApi = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
placeholderApi = { module = "me.clip:placeholderapi", version.ref = "placeholderApi" }
fancyHolograms = { module = "de.oliver:FancyHolograms", version.ref = "fancyHolograms" }
fancyNpcs = { module = "de.oliver:FancyNpcs", version.ref = "fancyNpcs" }
worldGuard = { module = "com.sk89q.worldguard:worldguard-bukkit", version.ref = "worldGuard" }

acfPaper = { module = "co.aikar:acf-paper", version.ref = "acf" }
configurateYaml = { module = "org.spongepowered:configurate-yaml", version.ref = "configurate" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
mariadbJdbc = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb" }
invui = { module = "xyz.xenondevs.invui:invui", version.ref = "invui" }
exposedCore = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposedJdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposedJavaTime = { module = "org.jetbrains.exposed:exposed-java-time", version.ref = "exposed" }
coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }

[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
resourceFactoryPaperConvention = { id = "xyz.jpenilla.resource-factory-paper-convention", version.ref = "resource-factory" }
